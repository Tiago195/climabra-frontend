server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Download do APK do app Android (Fase 3.2(a) do PLANO_APP_CAPACITOR.md — distribuição
    # self-hosted, sem Play Store):
    #   http://<host>:8090/app/latest.apk    → o APK de release assinado
    #   http://<host>:8090/app/version.json  → manifesto {versionCode, versionName, url, notes}
    #
    # Os arquivos vêm de um VOLUME montado em /srv/app (apk-dist no docker-compose.opi.yml), NÃO
    # da imagem: publicar uma versão nova é copiar pro volume (scripts/publish-apk.sh), sem
    # rebuild/redeploy do front. Precisa vir ANTES do `location /` — senão o try_files do SPA
    # devolveria o index.html no lugar do APK.
    #
    # O tipo MIME correto é o que faz o Android oferecer "instalar" em vez de abrir como texto.
    # ACAO *: o app (origem http://localhost na WebView) lê o version.json cross-origin quando o
    # banner de atualização in-app existir; o APK em si é público de qualquer forma.
    location /app/ {
        root /srv;
        add_header Access-Control-Allow-Origin *;
        types {
            application/vnd.android.package-archive apk;
            application/json json;
        }
        default_type application/octet-stream;
        try_files $uri =404;
    }

    # SPA: rotas do client-side caem no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API na mesma origem: /api/* -> container api:8080/*  (sem CORS)
    location /api/ {
        proxy_pass http://api:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 12m;   # casa com o multipart max de 10MB da API
    }
}

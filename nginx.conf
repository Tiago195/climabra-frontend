server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # DNS interno do Docker. Sem isto o nginx resolve `api`/`minio` UMA VEZ, no boot, e guarda o
    # IP para sempre: se o container da API reiniciar e trocar de IP, o nginx segue batendo no IP
    # velho e o site inteiro responde 502 até alguém reiniciar o nginx (aconteceu de verdade).
    # Com resolver + proxy_pass por VARIÁVEL, a resolução vira por requisição (cache de 10s).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream_api   "http://api:8080";
    set $upstream_minio "http://minio:9000";

    # Download do APK do app Android (Fase 3.2(a) do PLANO_APP_CAPACITOR.md — distribuição
    # self-hosted, sem Play Store):
    #   http://<host>:8090/app/latest.apk    → o APK de release assinado
    #   http://<host>:8090/app/version.json  → manifesto {versionCode, versionName, url, notes}
    #
    # Os arquivos vêm de um VOLUME montado em /srv/app (apk-dist no docker-compose.opi.yml), NÃO
    # da imagem: publicar uma versão nova é copiar pro volume (scripts/publish-apk.sh), sem
    # rebuild/redeploy do front. Precisa vir ANTES do `location /` — senão o try_files do SPA
    # devolveria o index.html no lugar do APK.
    #
    # O tipo MIME correto é o que faz o Android oferecer "instalar" em vez de abrir como texto.
    # ACAO *: o app (origem http://localhost na WebView) lê o version.json cross-origin quando o
    # banner de atualização in-app existir; o APK em si é público de qualquer forma.
    location /app/ {
        root /srv;
        add_header Access-Control-Allow-Origin *;
        types {
            application/vnd.android.package-archive apk;
            application/json json;
        }
        default_type application/octet-stream;
        try_files $uri =404;
    }

    # SPA: rotas do client-side caem no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API na mesma origem: /api/* -> container api:8080/*  (sem CORS)
    # proxy_pass por variável não corta o prefixo da location sozinho — daí o rewrite.
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $upstream_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 12m;   # casa com o multipart max de 10MB da API
    }

    # Webhooks do Asaas na mesma origem: /webhooks/* -> api:8080/webhooks/*
    # É o que permite ASAAS_WEBHOOK_URL=https://climabra.com.br/webhooks/asaas — a Asaas
    # precisa ALCANÇAR a API de fora, e o túnel só expõe esta porta (a 8091 não é pública).
    location /webhooks/ {
        proxy_pass $upstream_api;   # sem rewrite: o path /webhooks/... é o mesmo na API
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Imagens (MinIO) na mesma origem: /files/<bucket>/<key> -> minio:9000/<bucket>/<key>
    # A URL pública da imagem é GRAVADA NO BANCO no upload (StorageService: publicUrl + "/" + key),
    # então ela precisa ser alcançável do lado de fora. Publicar a 9010 no túnel exigiria um 2º
    # hostname; passando pelo nginx, R2_PUBLIC_URL=https://climabra.com.br/files/climabra e as
    # imagens saem no MESMO https do site (sem mixed content, sem CORS, sem porta extra).
    location /files/ {
        rewrite ^/files/(.*)$ /$1 break;
        proxy_pass $upstream_minio;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
